<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Success</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .ok { color: #1b5e20; font-weight: bold; }
  </style>
  <script>
    // Optional: notify opener and close if opened in a new tab/window
    window.onload = function() {
      if (window.opener) {
        window.opener.postMessage({paymentStatus: 'COMPLETED'}, '*');
      }
    };
  </script>
  </head>
<body>
  <h3 class="ok">Payment completed successfully.</h3>
  <p>You can close this window and return to the app.</p>
</body>
</html>
