<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Covoiturage</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 500px;
        }
        
        .login-form {
            padding: 50px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h1 {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .form-control {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(52,152,219,.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--secondary-color), #2980b9);
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52,152,219,.3);
        }
        
        .alert {
            border-radius: 10px;
            border: none;
            padding: 15px 20px;
        }
        
        .login-image {
            background: linear-gradient(135deg, var(--primary-color), #34495e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 50px;
        }
        
        .login-image i {
            font-size: 8rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .login-image h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        
        .login-image p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .loading {
            display: none;
        }
        
        @media (max-width: 768px) {
            .login-image {
                display: none;
            }
            
            .login-form {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row g-0">
            <div class="col-md-6">
                <div class="login-form">
                    <div class="login-header">
                        <h1><i class="fas fa-shield-alt"></i> Admin Login</h1>
                        <p>Accédez au panneau d'administration</p>
                    </div>
                    
                    <div id="alertContainer"></div>
                    
                    <form id="loginForm">
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Nom d'utilisateur ou Email
                            </label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Mot de passe
                            </label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="mb-4">
                            <button type="submit" class="btn btn-login" id="loginBtn">
                                <span class="btn-text">Se connecter</span>
                                <div class="loading">
                                    <i class="fas fa-spinner fa-spin"></i> Connexion...
                                </div>
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <small class="text-muted">
                            <i class="fas fa-info-circle"></i> 
                            Accès réservé aux administrateurs
                        </small>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="login-image">
                    <div>
                        <i class="fas fa-car"></i>
                        <h2>Covoiturage</h2>
                        <p>Panneau d'administration<br>Gestion complète du système</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class AdminLogin {
            constructor() {
                this.baseUrl = window.location.origin + '/api/admin/auth';
                this.init();
            }

            init() {
                // Check if already logged in
                const token = localStorage.getItem('adminToken');
                if (token && this.validateToken(token)) {
                    window.location.href = '/admin-dashboard.html';
                    return;
                }

                this.setupEventListeners();
            }

            setupEventListeners() {
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.login();
                });
            }

            async login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (!username || !password) {
                    this.showAlert('Veuillez remplir tous les champs', 'danger');
                    return;
                }

                this.setLoading(true);

                try {
                    const response = await fetch(`${this.baseUrl}/signin`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            usernameOrEmail: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // Store token and redirect
                        localStorage.setItem('adminToken', data.token);
                        localStorage.setItem('adminUser', JSON.stringify({
                            id: data.id,
                            username: data.username,
                            email: data.email,
                            roles: data.roles
                        }));
                        
                        this.showAlert('Connexion réussie! Redirection...', 'success');
                        setTimeout(() => {
                            window.location.href = '/admin-dashboard.html';
                        }, 1000);
                    } else {
                        // Handle suspension error with detailed message
                        if (data.error === 'Account Suspended') {
                            let message = `<strong>${data.message}</strong><br>`;
                            if (data.reason) {
                                message += `<small>Raison: ${data.reason}</small><br>`;
                            }
                            if (data.suspensionEndDate && data.suspensionEndDate !== 'Indefinite') {
                                message += `<small>Fin de suspension: ${new Date(data.suspensionEndDate).toLocaleString('fr-FR')}</small>`;
                            } else if (data.suspensionEndDate === 'Indefinite') {
                                message += `<small>Suspension indéfinie</small>`;
                            }
                            this.showAlert(message, 'danger');
                        } else {
                            this.showAlert(data.message || 'Identifiants invalides', 'danger');
                        }
                    }
                } catch (error) {
                    this.showAlert('Erreur de connexion. Veuillez réessayer.', 'danger');
                } finally {
                    this.setLoading(false);
                }
            }

            async validateToken(token) {
                try {
                    const response = await fetch(`${this.baseUrl}/verify`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    return response.ok;
                } catch (error) {
                    return false;
                }
            }

            setLoading(loading) {
                const btn = document.getElementById('loginBtn');
                const btnText = btn.querySelector('.btn-text');
                const loadingDiv = btn.querySelector('.loading');
                
                if (loading) {
                    btn.disabled = true;
                    btnText.style.display = 'none';
                    loadingDiv.style.display = 'inline-block';
                } else {
                    btn.disabled = false;
                    btnText.style.display = 'inline-block';
                    loadingDiv.style.display = 'none';
                }
            }

            showAlert(message, type) {
                const alertContainer = document.getElementById('alertContainer');
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i>
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
                
                // Auto-dismiss success messages
                if (type === 'success') {
                    setTimeout(() => {
                        const alert = alertContainer.querySelector('.alert');
                        if (alert) {
                            alert.remove();
                        }
                    }, 3000);
                }
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new AdminLogin();
        });
    </script>
</body>
</html>
