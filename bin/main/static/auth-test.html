<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
        }
        .result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #3498db;
        }
        .error {
            border-left-color: #e74c3c;
            background: #fdf2f2;
        }
        .success {
            border-left-color: #27ae60;
            background: #f0f9f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2>🔐 Authentication Test</h2>
                        <p>Test admin authentication with different credentials</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Test Credentials:</h5>
                                <div class="mb-3">
                                    <label class="form-label">Username/Email:</label>
                                    <input type="text" id="username" class="form-control" value="admin">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password:</label>
                                    <input type="password" id="password" class="form-control" value="admin123">
                                </div>
                                <button class="btn btn-primary" onclick="testLogin()">Test Login</button>
                            </div>
                            <div class="col-md-6">
                                <h5>Alternative Credentials:</h5>
                                <button class="btn btn-secondary" onclick="testWithPassword('admin', 'admin')">admin/admin</button>
                                <button class="btn btn-secondary" onclick="testWithPassword('admin', 'password')">admin/password</button>
                                <button class="btn btn-secondary" onclick="testWithPassword('admin@covoiturage.com', 'admin123')">admin@covoiturage.com/admin123</button>
                                <button class="btn btn-secondary" onclick="testWithPassword('admin', '123456')">admin/123456</button>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <h5>Test Results:</h5>
                        <div id="results"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const baseUrl = 'http://localhost:8081';

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            
            let icon = 'info-circle';
            if (type === 'error') icon = 'exclamation-triangle';
            else if (type === 'success') icon = 'check-circle';
            
            resultDiv.innerHTML = `
                <h6><i class="fas fa-${icon}"></i> ${title}</h6>
                <pre style="white-space: pre-wrap; font-size: 0.9rem; max-height: 200px; overflow-y: auto;">${content}</pre>
            `;
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await testWithPassword(username, password);
        }

        async function testWithPassword(username, password) {
            try {
                addResult(`Testing Login: ${username}`, `Attempting login with username: ${username}`, 'info');
                
                const response = await fetch(`${baseUrl}/api/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: username,
                        password: password
                    })
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult(`✅ Login Success: ${username}`, `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult(`❌ Login Failed: ${username}`, `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Login Error: ${username}`, `Error: ${error.message}`, 'error');
            }
        }

        // Test on page load
        window.onload = function() {
            addResult('Authentication Test Ready', 'Enter credentials and click "Test Login" or try the alternative credentials below.', 'info');
        };
    </script>
</body>
</html>
