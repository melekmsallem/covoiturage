# Production Configuration for Covoiturage App

# Stripe configuration (PRODUCTION)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=EUR
# UPDATE THESE TO YOUR PRODUCTION DOMAIN
stripe.success-url=https://covoiturage.tn/payment-success.html
stripe.cancel-url=https://covoiturage.tn/payment-cancel.html

# Payments config
payments.base-currency=TND
payments.tnd-to-eur-rate=0.29
spring.application.name=covoiturage_final

# Database Configuration (PRODUCTION)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/covoiturage_prod_db?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration (PRODUCTION)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# JWT Configuration (USE STRONG SECRET IN PROD)
app.jwtSecret=${JWT_SECRET:CHANGE-THIS-TO-A-LONG-RANDOM-SECRET-IN-PRODUCTION}
app.jwtExpirationMs=86400000

# Email Configuration (PRODUCTION)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}

# WebSocket Configuration
spring.websocket.stomp.broker.relay.enabled=false
spring.websocket.stomp.broker.simple.enabled=true

# Cache Configuration
spring.cache.type=simple

# Logging (PRODUCTION)
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.esprit.pfe.covoiturage_final=INFO
logging.level.esprit.pfe.covoiturage_final.controllers.StripeController=INFO
logging.level.esprit.pfe.covoiturage_final.services.PaymentServiceImpl=INFO
logging.file.name=logs/covoiturage-app.log
logging.file.max-size=10MB
logging.file.max-history=30

# Cleanup retention (days after departure to keep data)
cleanup.retention.days=7

# Actuator endpoints (secure in production)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized


















