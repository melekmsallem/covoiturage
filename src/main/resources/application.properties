# Stripe configuration
# For security, set these via environment variables in dev/prod
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=whsec_d0b577ba557503992a462b8ab69aacbd13288855c4e56717a95f90a3845e0c12
stripe.currency=EUR
stripe.success-url=http://localhost:8081/payment-success.html
stripe.cancel-url=http://localhost:8081/payment-cancel.html

# Payments config
payments.base-currency=TND
payments.tnd-to-eur-rate=0.29
spring.application.name=covoiturage_final

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/covoiturage_final_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Data Initialization
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Server Configuration
server.port=8081
server.address=0.0.0.0

# JWT Configuration
app.jwtSecret=your-secret-key-here-make-it-long-and-secure-for-production
app.jwtExpirationMs=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# WebSocket Configuration
spring.websocket.stomp.broker.relay.enabled=false
spring.websocket.stomp.broker.simple.enabled=true

# Cache Configuration
spring.cache.type=simple

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.esprit.pfe.covoiturage_final=DEBUG

# Cleanup retention (days after departure to keep data)
cleanup.retention.days=1
