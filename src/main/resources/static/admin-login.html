<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f3f6fb; }
    .login-card { max-width: 420px; margin: 8vh auto; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.08); }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('alertBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
          const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
          const password = document.getElementById('password').value;
          const resp = await fetch(window.location.origin + '/api/admin/auth/signin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usernameOrEmail, password })
          });
          if (!resp.ok) {
            const txt = await resp.text();
            throw new Error(txt || ('HTTP ' + resp.status));
          }
          const data = await resp.json();
          // data contains token in JwtResponse.jwt
          const token = data.token || data.jwt || data.accessToken || data.access_token || data?.jwtToken || data?.jwt;
          if (!token) throw new Error('No token returned');
          localStorage.setItem('adminToken', token);
          // Also set generic key so dashboard can read either
          localStorage.setItem('auth_token', token);
          window.location.href = '/admin-dashboard.html';
        } catch (err) {
          alertBox.textContent = 'Login failed: ' + (err.message || err);
          alertBox.classList.remove('d-none');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    });
  </script>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4">
      <h4 class="mb-1">Admin Login</h4>
      <p class="text-muted mb-4">Sign in with an administrator account</p>
      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
      <form id="loginForm" autocomplete="on">
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input id="usernameOrEmail" class="form-control" type="text" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" class="form-control" type="password" required />
        </div>
        <button id="loginBtn" type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
