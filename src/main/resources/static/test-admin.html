<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
        }
        .result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #3498db;
        }
        .success {
            border-left-color: #27ae60;
            background: #d5f4e6;
        }
        .error {
            border-left-color: #e74c3c;
            background: #fadbd8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Test Admin User Creation</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button class="btn btn-primary" onclick="testAdminUser()">Test Admin User Exists</button>
                            <button class="btn btn-success" onclick="createAdminUser()">Create Admin User</button>
                            <button class="btn btn-warning" onclick="createAdmin1User()">Create Admin1 User</button>
                            <button class="btn btn-danger" onclick="resetAdminPasswords()">Reset Admin Passwords</button>
                            <button class="btn btn-info" onclick="testLogin()">Test Login</button>
                            <button class="btn btn-secondary" onclick="testLoginAdmin1()">Test Login Admin1</button>
                        </div>
                        <div id="results"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const baseUrl = 'http://localhost:8081/api';

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                <h6>${title}</h6>
                <pre>${content}</pre>
            `;
            resultsDiv.appendChild(resultDiv);
        }

        async function testAdminUser() {
            try {
                addResult('Testing Admin User', 'Checking if admin user exists in database...', 'info');
                
                const response = await fetch(`${baseUrl}/simple/check-admin`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Admin User Check', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Admin User Check Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Admin User Check Error', `Error: ${error.message}`, 'error');
            }
        }

        async function createAdminUser() {
            try {
                addResult('Creating Admin User', 'Creating admin user in database...', 'info');
                
                const response = await fetch(`${baseUrl}/simple/create-admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Admin User Created', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Admin User Creation Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Admin User Creation Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            try {
                addResult('Testing Login', 'Testing admin login...', 'info');
                
                const response = await fetch(`${baseUrl}/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: 'admin',
                        password: 'admin123'
                    })
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Login Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Login Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Login Error', `Error: ${error.message}`, 'error');
            }
        }

        async function createAdmin1User() {
            try {
                addResult('Creating Admin1 User', 'Creating admin1 user in database...', 'info');
                
                const response = await fetch(`${baseUrl}/simple/create-admin1`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Admin1 User Created', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Admin1 User Creation Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Admin1 User Creation Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testLoginAdmin1() {
            try {
                addResult('Testing Admin1 Login', 'Testing admin1 login...', 'info');
                
                const response = await fetch(`${baseUrl}/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: 'admin1',
                        password: 'admin123'
                    })
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Admin1 Login Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Admin1 Login Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Admin1 Login Error', `Error: ${error.message}`, 'error');
            }
        }

        async function resetAdminPasswords() {
            try {
                addResult('Resetting Admin Passwords', 'Deleting existing admin users and recreating with proper password encoding...', 'info');
                
                const response = await fetch(`${baseUrl}/simple/reset-admin-passwords`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Admin Passwords Reset', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Admin Password Reset Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Admin Password Reset Error', `Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
