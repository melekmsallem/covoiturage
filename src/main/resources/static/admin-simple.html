<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .btn {
            border-radius: 8px;
            margin: 5px;
        }
        .result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #3498db;
        }
        .error {
            border-left-color: #e74c3c;
            background: #fdf2f2;
        }
        .success {
            border-left-color: #27ae60;
            background: #f0f9f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2><i class="fas fa-car"></i> Covoiturage Admin Dashboard</h2>
                        <p>Simple Test Interface</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Test API Endpoints</h5>
                                <button class="btn btn-primary" onclick="testAPI('/api/test/sprint4')">
                                    <i class="fas fa-play"></i> Test Sprint 4
                                </button>
                                <button class="btn btn-success" onclick="testAPI('/api/test/sprint4/dashboard-test')">
                                    <i class="fas fa-chart-bar"></i> Dashboard Stats
                                </button>
                                <button class="btn btn-info" onclick="testAPI('/api/test/sprint4/features')">
                                    <i class="fas fa-list"></i> Features
                                </button>
                                <button class="btn btn-warning" onclick="testAPI('/api/test/sprint4/system-health')">
                                    <i class="fas fa-heartbeat"></i> System Health
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h5>Test Authentication</h5>
                                <button class="btn btn-primary" onclick="testAuth()">
                                    <i class="fas fa-key"></i> Test Login
                                </button>
                                <button class="btn btn-secondary" onclick="testUsers()">
                                    <i class="fas fa-users"></i> Test Users API
                                </button>
                                <button class="btn btn-info" onclick="testTrips()">
                                    <i class="fas fa-route"></i> Test Trips API
                                </button>
                                <button class="btn btn-success" onclick="testCities()">
                                    <i class="fas fa-map-marker-alt"></i> Test Cities API
                                </button>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <h5>Results:</h5>
                        <div id="results"></div>
                        
                        <hr>
                        
                        <h5>Quick Access Links:</h5>
                        <a href="admin-login.html" class="btn btn-outline-primary">
                            <i class="fas fa-sign-in-alt"></i> Full Admin Login
                        </a>
                        <a href="admin-dashboard.html" class="btn btn-outline-success">
                            <i class="fas fa-tachometer-alt"></i> Full Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const baseUrl = 'http://localhost:8081';
        let authToken = null;

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                <h6><i class="fas fa-${type === 'error' ? 'exclamation-triangle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i> ${title}</h6>
                <pre style="white-space: pre-wrap; font-size: 0.9rem;">${content}</pre>
            `;
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }

        async function testAPI(endpoint) {
            try {
                addResult(`Testing ${endpoint}`, 'Loading...', 'info');
                
                const response = await fetch(`${baseUrl}${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult(`✅ ${endpoint}`, `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult(`❌ ${endpoint}`, `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult(`❌ ${endpoint}`, `Connection Error: ${error.message}`, 'error');
            }
        }

        async function testAuth() {
            try {
                addResult('Testing Authentication', 'Attempting login...', 'info');
                
                const response = await fetch(`${baseUrl}/api/auth/signin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usernameOrEmail: 'admin',
                        password: 'admin123'
                    })
                });

                const data = await response.text();
                
                if (response.ok) {
                    const authData = JSON.parse(data);
                    authToken = authData.token;
                    addResult('✅ Authentication Success', `Status: ${response.status}\nToken: ${authToken.substring(0, 50)}...\nUser: ${authData.username} (${authData.role})`, 'success');
                } else {
                    addResult('❌ Authentication Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Authentication Error', `Connection Error: ${error.message}`, 'error');
            }
        }

        async function testUsers() {
            try {
                addResult('Testing Users API', 'Loading users...', 'info');
                
                const headers = {
                    'Content-Type': 'application/json'
                };
                
                if (authToken) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }
                
                const response = await fetch(`${baseUrl}/api/admin/users`, {
                    method: 'GET',
                    headers: headers
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Users API Success', `Status: ${response.status}\nUsers: ${data}`, 'success');
                } else {
                    addResult('❌ Users API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Users API Error', `Connection Error: ${error.message}`, 'error');
            }
        }

        async function testTrips() {
            try {
                addResult('Testing Trips API', 'Loading trips...', 'info');
                
                const response = await fetch(`${baseUrl}/api/trips/available`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Trips API Success', `Status: ${response.status}\nTrips: ${data}`, 'success');
                } else {
                    addResult('❌ Trips API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Trips API Error', `Connection Error: ${error.message}`, 'error');
            }
        }

        async function testCities() {
            try {
                addResult('Testing Cities API', 'Loading cities...', 'info');
                
                const response = await fetch(`${baseUrl}/api/cities`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Cities API Success', `Status: ${response.status}\nCities: ${data}`, 'success');
                } else {
                    addResult('❌ Cities API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Cities API Error', `Connection Error: ${error.message}`, 'error');
            }
        }

        // Auto-test on page load
        window.onload = function() {
            addResult('Page Loaded', 'Ready to test API endpoints. Click buttons above to test different functionalities.', 'info');
        };
    </script>
</body>
</html>
