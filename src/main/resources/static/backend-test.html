<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Test - Covoiturage</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .btn {
            border-radius: 8px;
            margin: 5px;
        }
        .result {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #3498db;
        }
        .error {
            border-left-color: #e74c3c;
            background: #fdf2f2;
        }
        .success {
            border-left-color: #27ae60;
            background: #f0f9f0;
        }
        .warning {
            border-left-color: #f39c12;
            background: #fef9e7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header text-center">
                        <h2><i class="fas fa-server"></i> Backend Test Interface</h2>
                        <p>Covoiturage Application - Backend Diagnostics</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h5><i class="fas fa-play-circle"></i> Basic Tests</h5>
                                <button class="btn btn-primary" onclick="testBasic()">
                                    <i class="fas fa-check"></i> Test Basic Connection
                                </button>
                                <button class="btn btn-success" onclick="testHealth()">
                                    <i class="fas fa-heartbeat"></i> Health Check
                                </button>
                                <button class="btn btn-info" onclick="testAuth()">
                                    <i class="fas fa-key"></i> Test Real Auth
                                </button>
                                <button class="btn btn-warning" onclick="testSimpleAuth()">
                                    <i class="fas fa-key"></i> Test Simple Auth
                                </button>
                                <button class="btn btn-info" onclick="checkAdmin()">
                                    <i class="fas fa-user-shield"></i> Check Admin User
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h5><i class="fas fa-database"></i> Database Tests</h5>
                                <button class="btn btn-warning" onclick="testUsers()">
                                    <i class="fas fa-users"></i> Test Users
                                </button>
                                <button class="btn btn-info" onclick="testTrips()">
                                    <i class="fas fa-route"></i> Test Trips
                                </button>
                                <button class="btn btn-secondary" onclick="testCities()">
                                    <i class="fas fa-map-marker-alt"></i> Test Cities
                                </button>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <h5><i class="fas fa-tools"></i> Admin Tests</h5>
                                <button class="btn btn-primary" onclick="testSprint4()">
                                    <i class="fas fa-chart-bar"></i> Sprint 4 Test
                                </button>
                                <button class="btn btn-success" onclick="testDashboard()">
                                    <i class="fas fa-tachometer-alt"></i> Dashboard Stats
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h5><i class="fas fa-external-link-alt"></i> Quick Access</h5>
                                <a href="admin-simple.html" class="btn btn-outline-primary">
                                    <i class="fas fa-cog"></i> Admin Simple
                                </a>
                                <a href="admin-login.html" class="btn btn-outline-success">
                                    <i class="fas fa-sign-in-alt"></i> Admin Login
                                </a>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <h5><i class="fas fa-list"></i> Test Results:</h5>
                        <div id="results"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const baseUrl = 'http://localhost:8081';

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            
            let icon = 'info-circle';
            if (type === 'error') icon = 'exclamation-triangle';
            else if (type === 'success') icon = 'check-circle';
            else if (type === 'warning') icon = 'exclamation-circle';
            
            resultDiv.innerHTML = `
                <h6><i class="fas fa-${icon}"></i> ${title}</h6>
                <pre style="white-space: pre-wrap; font-size: 0.9rem; max-height: 200px; overflow-y: auto;">${content}</pre>
            `;
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }

        async function testBasic() {
            try {
                addResult('Testing Basic Connection', 'Connecting to backend...', 'info');
                
                const response = await fetch(`${baseUrl}/api/simple/test`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Basic Connection Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Basic Connection Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Connection Error', `Cannot connect to backend: ${error.message}\n\nPossible issues:\n- Backend not running\n- Wrong port (should be 8081)\n- Firewall blocking connection`, 'error');
            }
        }

        async function testHealth() {
            try {
                addResult('Testing Health Check', 'Checking system health...', 'info');
                
                const response = await fetch(`${baseUrl}/api/simple/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Health Check Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Health Check Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Health Check Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testAuth() {
            try {
                addResult('Testing Authentication', 'Testing admin login with real backend...', 'info');
                
                const response = await fetch(`${baseUrl}/api/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: 'admin',
                        password: 'admin123'
                    })
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Authentication Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Authentication Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Authentication Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testSimpleAuth() {
            try {
                addResult('Testing Simple Auth', 'Testing simple authentication endpoint...', 'info');
                
                const response = await fetch(`${baseUrl}/api/simple/auth/test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usernameOrEmail: 'admin',
                        password: 'admin123'
                    })
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Simple Auth Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Simple Auth Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Simple Auth Error', `Error: ${error.message}`, 'error');
            }
        }

        async function checkAdmin() {
            try {
                addResult('Checking Admin User', 'Checking if admin user exists in database...', 'info');
                
                const response = await fetch(`${baseUrl}/api/simple/check-admin`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Admin Check Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Admin Check Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Admin Check Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testUsers() {
            try {
                addResult('Testing Users API', 'Loading users from database...', 'info');
                
                const response = await fetch(`${baseUrl}/api/users`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Users API Success', `Status: ${response.status}\nUsers: ${data}`, 'success');
                } else {
                    addResult('❌ Users API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Users API Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testTrips() {
            try {
                addResult('Testing Trips API', 'Loading trips from database...', 'info');
                
                const response = await fetch(`${baseUrl}/api/trips/available`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Trips API Success', `Status: ${response.status}\nTrips: ${data}`, 'success');
                } else {
                    addResult('❌ Trips API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Trips API Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testCities() {
            try {
                addResult('Testing Cities API', 'Loading cities from database...', 'info');
                
                const response = await fetch(`${baseUrl}/api/cities`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Cities API Success', `Status: ${response.status}\nCities: ${data}`, 'success');
                } else {
                    addResult('❌ Cities API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Cities API Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testSprint4() {
            try {
                addResult('Testing Sprint 4 API', 'Testing admin dashboard backend...', 'info');
                
                const response = await fetch(`${baseUrl}/api/test/sprint4`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Sprint 4 API Success', `Status: ${response.status}\nResponse: ${data}`, 'success');
                } else {
                    addResult('❌ Sprint 4 API Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Sprint 4 API Error', `Error: ${error.message}`, 'error');
            }
        }

        async function testDashboard() {
            try {
                addResult('Testing Dashboard Stats', 'Loading dashboard statistics...', 'info');
                
                const response = await fetch(`${baseUrl}/api/test/sprint4/dashboard-test`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.text();
                
                if (response.ok) {
                    addResult('✅ Dashboard Stats Success', `Status: ${response.status}\nStats: ${data}`, 'success');
                } else {
                    addResult('❌ Dashboard Stats Failed', `Status: ${response.status}\nError: ${data}`, 'error');
                }
            } catch (error) {
                addResult('❌ Dashboard Stats Error', `Error: ${error.message}`, 'error');
            }
        }

        // Auto-test on page load
        window.onload = function() {
            addResult('Backend Test Interface Loaded', 'Ready to test backend functionality. Click buttons above to test different components.\n\nStart with "Test Basic Connection" to verify the backend is running.', 'info');
        };
    </script>
</body>
</html>
