<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="-1">
    <title>Redirecting...</title>
    <script>
        // Clear all caches and redirect
        console.log('🧹 Clearing all caches and redirecting...');
        
        // Clear localStorage version to force reload
        localStorage.removeItem('adminDashboardVersion');
        
        // Redirect to v3 with timestamp
        const timestamp = new Date().getTime();
        window.location.href = '/admin-dashboard-v3.html?t=' + timestamp + '&fresh=true';
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h2>🔄 Clearing cache and redirecting...</h2>
        <p>Please wait...</p>
    </div>
</body>
</html>
