<!DOCTYPE html>
<html>
<head>
    <title>Simple WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <h1>Simple WebSocket Test</h1>
    
    <div>
        <button onclick="testSimpleWebSocket()">Test Simple WebSocket</button>
        <button onclick="testSockJS()">Test SockJS</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Enter test message" value="Hello WebSocket!">
        <button onclick="sendMessage()">Send Message</button>
    </div>
    
    <div id="log"></div>

    <script>
        let ws = null;
        let sockjs = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const messageDiv = document.createElement('div');
            messageDiv.className = `log ${type}`;
            messageDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> - ${message}`;
            logDiv.appendChild(messageDiv);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function testSimpleWebSocket() {
            log('Testing Simple WebSocket connection...', 'info');
            
            try {
                ws = new WebSocket('ws://localhost:8081/ws');
                
                ws.onopen = function(event) {
                    log('✅ Simple WebSocket connected successfully!', 'success');
                };
                
                ws.onmessage = function(event) {
                    log(`📥 Message received: ${event.data}`, 'info');
                };
                
                ws.onerror = function(error) {
                    log(`❌ WebSocket error: ${error}`, 'error');
                };
                
                ws.onclose = function(event) {
                    log(`🔌 WebSocket closed: Code ${event.code}, Reason: ${event.reason}`, 'info');
                };
                
            } catch (error) {
                log(`❌ Failed to create WebSocket: ${error.message}`, 'error');
            }
        }

        function testSockJS() {
            log('Testing SockJS connection...', 'info');
            
            // Load SockJS dynamically
            if (typeof SockJS === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js';
                script.onload = function() {
                    connectSockJS();
                };
                document.head.appendChild(script);
            } else {
                connectSockJS();
            }
        }

        function connectSockJS() {
            try {
                sockjs = new SockJS('http://localhost:8081/ws');
                
                sockjs.onopen = function() {
                    log('✅ SockJS connected successfully!', 'success');
                };
                
                sockjs.onmessage = function(e) {
                    log(`📥 SockJS message: ${e.data}`, 'info');
                };
                
                sockjs.onclose = function() {
                    log('🔌 SockJS connection closed', 'info');
                };
                
                sockjs.onerror = function(error) {
                    log(`❌ SockJS error: ${error}`, 'error');
                };
                
            } catch (error) {
                log(`❌ Failed to create SockJS: ${error.message}`, 'error');
            }
        }

        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                log(`📤 Sent via WebSocket: ${message}`, 'info');
            } else if (sockjs && sockjs.readyState === SockJS.OPEN) {
                sockjs.send(message);
                log(`📤 Sent via SockJS: ${message}`, 'info');
            } else {
                log('❌ No active connection to send message', 'error');
            }
        }

        // Test on page load
        window.onload = function() {
            log('WebSocket Test Page Loaded', 'info');
            log('Click "Test Simple WebSocket" or "Test SockJS" to start testing', 'info');
        };
    </script>
</body>
</html>
